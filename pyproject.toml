[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xss-framework"
version = "1.0.0"
description = "Professional-grade Reflective XSS security testing framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CyVen" }]
keywords = ["xss", "security", "penetration-testing", "cybersecurity", "offensive-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "typer>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "aioresponses>=0.7",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
xsf = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "modules*", "payloads*", "reports*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmark (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
